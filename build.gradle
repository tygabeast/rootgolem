buildscript {
    repositories {
        maven { url = 'https://maven.neoforged.net/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath('net.neoforged:moddev-gradle:2.0.148') {
            exclude group: 'gradle.plugin.org.jetbrains.gradle.plugin.idea-ext'
        }
    }
}
apply plugin: 'java-library'
apply plugin: 'net.neoforged.moddev'

version = mod_version
group = 'com.tygabeast.rootgolem'
base { archivesName = 'rootgolem' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

neoForge {
    version = neo_version
    runs {
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        rootgolem { sourceSet sourceSets.main }
    }
}

tasks.withType(ProcessResources).configureEach {
    var props = [mod_version: mod_version]
    inputs.properties props
    filesMatching(['META-INF/neoforge.mods.toml']) { expand props }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

jar {
    from('README.md')
    from('LICENSE')
}
